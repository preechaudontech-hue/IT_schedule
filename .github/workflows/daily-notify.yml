name: daily-notify

on:
  # No `schedule:` trigger here on purpose — GitHub Actions' own cron was
  # observed drifting 4-5+ hours late every day on this repo (not the usual
  # 5-15 min). Triggering is instead handled by an external scheduler
  # (cron-job.org, free) that calls the GitHub REST API's "create a
  # workflow dispatch event" endpoint on time:
  #   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/daily-notify.yml/dispatches
  #   body: {"ref":"main","inputs":{"session":"morning"}}   (or "afternoon")
  #   headers: Authorization: Bearer <fine-grained PAT, Actions: read/write>
  #            Accept: application/vnd.github+json
  # See cron-job.org's "Next Runs" dashboard for the actual schedule times.
  workflow_dispatch:
    inputs:
      session:
        description: "Which announcement to send"
        type: choice
        options: [morning, afternoon]
        default: morning
      dry_run:
        description: "Print message only, do not send"
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pick session for this run
        id: pick
        run: |
          echo "session=${{ inputs.session || 'morning' }}" >> "$GITHUB_OUTPUT"
      - name: Send announcement
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_WORKSHEET: schedule
          SEND_WHEN_EMPTY: "0"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/notify.py --session ${{ steps.pick.outputs.session }} --dry-run --debug
          else
            python src/notify.py --session ${{ steps.pick.outputs.session }}
          fi
