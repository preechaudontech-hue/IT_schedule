<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แจ้งกำหนดการปฏิบัติงาน — แผนก IT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>📢 กำหนดการปฏิบัติงาน — แผนก IT</h1>
    <p class="hint">กรอกรายการที่นี่ ระบบจะแจ้งเข้ากลุ่ม LINE อัตโนมัติทุกเช้า 08:00 น.</p>

    <form id="form">
      <div class="grid">
        <label>วันที่ *<input type="date" name="date" required /></label>
        <label>เวลา<input type="time" name="time" /></label>
      </div>

      <div class="field-block">
        <span class="field-label">ชื่อ-สกุล *</span>
        <div class="chk-group" id="nameChecks">
          <label class="chk-item"><input type="checkbox" value="ทุกคน" data-all /> ทุกคน</label>
          <label class="chk-item"><input type="checkbox" value="อ.วิชัย" /> อ.วิชัย</label>
          <label class="chk-item"><input type="checkbox" value="อ.รุ่งนภา" /> อ.รุ่งนภา</label>
          <label class="chk-item"><input type="checkbox" value="อ.ศักดิ์สิทธิ์" /> อ.ศักดิ์สิทธิ์</label>
          <label class="chk-item"><input type="checkbox" value="อ.อุสาห์" /> อ.อุสาห์</label>
          <label class="chk-item"><input type="checkbox" value="อ.ปรีชา" /> อ.ปรีชา</label>
          <label class="chk-item"><input type="checkbox" value="อ.ณัฐพล" /> อ.ณัฐพล</label>
          <label class="chk-item"><input type="checkbox" value="อ.กฤชรัช" /> อ.กฤชรัช</label>
          <label class="chk-item"><input type="checkbox" value="อ.นัฎวัสส์" /> อ.นัฎวัสส์</label>
          <label class="chk-item"><input type="checkbox" value="น้องต้นกล้า" /> น้องต้นกล้า</label>
        </div>
      </div>

      <div class="field-block">
        <span class="field-label">สถานที่</span>
        <select id="placeSelect">
          <option value="">— เลือกสถานที่ —</option>
          <option>ห้องประชุมร่มประดู่ 1</option>
          <option>ห้องประชุมร่มประดู่ 2 (ข้างห้อง ผอ.)</option>
          <option>ห้องประชุมอินทนิล (อาคารพัสดุ)</option>
          <option>ห้องโสตทัศนศึกษา</option>
          <option value="__other__">อื่นๆ (โปรดแจ้ง)</option>
        </select>
        <input type="text" id="placeOther" placeholder="ระบุสถานที่" hidden />
      </div>

      <div class="grid">
        <label class="wide">รายการ/ภารกิจ *<input type="text" name="task" required value="ประชุม......" /></label>
        <label class="wide">หมายเหตุ<input type="text" name="note" /></label>
      </div>
      <button type="submit" id="submitBtn">บันทึกรายการ</button>
      <span id="msg" class="msg"></span>
    </form>

    <div class="toolbar">
      <h2>รายการที่บันทึกไว้</h2>
      <label class="chk"><input type="checkbox" id="showAll" /> ดูทั้งหมด (รวมที่ผ่านมาแล้ว)</label>
    </div>
    <div id="list" class="list">กำลังโหลด…</div>
  </main>

  <script>
    // ── ใส่ URL ของ Apps Script Web App (ลงท้าย /exec) ที่ deploy แล้ว ──
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXx_l5s6QK2W6yPsIGUFGD5P30bQX42vps63yDPhqTdFIZ0xmJspeOyJYfkns_vKje/exec";
    // ถ้าตั้ง PASSCODE ใน Code.gs ให้ใส่ตรงนี้ด้วย มิฉะนั้นปล่อยว่าง
    const PASSCODE = "";

    const $ = (s) => document.querySelector(s);
    const form = $("#form");
    const msg = $("#msg");
    const listEl = $("#list");
    const showAll = $("#showAll");
    const placeSelect = $("#placeSelect");
    const placeOther = $("#placeOther");
    const nameBoxes = [...document.querySelectorAll("#nameChecks input[type=checkbox]")];
    const allBox = nameBoxes.find((b) => b.dataset.all !== undefined);
    const personBoxes = nameBoxes.filter((b) => b !== allBox);

    const TH_MONTHS = ["", "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const TH_DOW = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

    function thaiDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return `วัน${TH_DOW[dt.getDay()]}ที่ ${d} ${TH_MONTHS[m]} ${y + 543}`;
    }
    function todayISO() {
      const n = new Date();
      const bkk = new Date(n.getTime() + (n.getTimezoneOffset() + 420) * 60000);
      return bkk.toISOString().slice(0, 10);
    }

    // ── ทุกคน ⇄ รายชื่อทีละคน: เลือก "ทุกคน" แล้วปิดการเลือกทีละคน ──
    allBox.onchange = () => {
      personBoxes.forEach((b) => {
        b.disabled = allBox.checked;
        if (allBox.checked) b.checked = false;
      });
    };

    // ── ภารกิจ: เลือกข้อความคำร่างทั้งหมดตอนโฟกัส พิมพ์ทับได้ทันที ──
    form.querySelector('[name=task]').addEventListener("focus", (e) => e.target.select());

    // ── สถานที่: เลือก "อื่นๆ" แล้วโชว์ช่องพิมพ์เอง ──
    placeSelect.onchange = () => {
      const isOther = placeSelect.value === "__other__";
      placeOther.hidden = !isOther;
      if (isOther) placeOther.focus();
      else placeOther.value = "";
    };

    async function api(method, params, body) {
      const url = new URL(APPS_SCRIPT_URL);
      if (PASSCODE) url.searchParams.set("key", PASSCODE);
      for (const k in (params || {})) url.searchParams.set(k, params[k]);
      const opt = { method, redirect: "follow" };
      if (body) {
        // text/plain => "simple request", ไม่มี CORS preflight
        opt.headers = { "Content-Type": "text/plain;charset=utf-8" };
        opt.body = JSON.stringify(Object.assign({ key: PASSCODE }, body));
      }
      const res = await fetch(url, opt);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "เกิดข้อผิดพลาด");
      return data;
    }

    function render(rows) {
      if (!rows.length) { listEl.innerHTML = '<p class="empty">ยังไม่มีรายการ</p>'; return; }
      const groups = {};
      for (const r of rows) (groups[r.date] ||= []).push(r);
      const html = Object.keys(groups).sort().map((date) => {
        const items = groups[date].map((r) => `
          <li>
            <div class="it-main">
              <span class="it-time">${escape_(r.time) || "—"}</span>
              <span class="it-name">${escape_(r.name)}</span>
            </div>
            <div class="it-task">${escape_(r.task)}${r.place ? " @ " + escape_(r.place) : ""}</div>
            ${r.note ? `<div class="it-note">• ${escape_(r.note)}</div>` : ""}
            <button class="del" data-row="${r.row}" title="ลบ">🗑</button>
          </li>`).join("");
        return `<section class="day"><h3>${thaiDate(date)}</h3><ul>${items}</ul></section>`;
      }).join("");
      listEl.innerHTML = html;
      listEl.querySelectorAll(".del").forEach((b) => b.onclick = () => del(b.dataset.row));
    }

    function escape_(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function load() {
      listEl.textContent = "กำลังโหลด…";
      try {
        const params = showAll.checked ? {} : { from: todayISO() };
        const data = await api("GET", params);
        render(data.rows);
      } catch (e) {
        listEl.innerHTML = `<p class="err">โหลดไม่สำเร็จ: ${escape_(e.message)}</p>`;
      }
    }

    async function del(row) {
      if (!confirm("ลบรายการนี้?")) return;
      try {
        await api("POST", null, { action: "delete", row: Number(row) });
        load();
      } catch (e) { alert("ลบไม่สำเร็จ: " + e.message); }
    }

    const TASK_DEFAULT = "ประชุม......";

    function resetPartial() {
      // เคลียร์แค่ เวลา/ภารกิจ/หมายเหตุ — คงวันที่, ชื่อที่เลือก, สถานที่ไว้ (มักกรอกต่อเนื่อง)
      form.querySelector('[name=time]').value = "";
      form.querySelector('[name=task]').value = TASK_DEFAULT;
      form.querySelector('[name=note]').value = "";
    }

    form.onsubmit = async (ev) => {
      ev.preventDefault();
      msg.textContent = ""; msg.className = "msg";

      const chosenNames = allBox.checked ? ["ทุกคน"] : personBoxes.filter((b) => b.checked).map((b) => b.value);
      if (!chosenNames.length) {
        msg.textContent = "✗ กรุณาเลือกชื่ออย่างน้อย 1 คน"; msg.className = "msg err";
        return;
      }

      let place = placeSelect.value;
      if (place === "__other__") place = placeOther.value.trim();

      const fd = Object.fromEntries(new FormData(form).entries());
      fd.name = chosenNames.join(", ");
      fd.place = place;

      $("#submitBtn").disabled = true;
      try {
        await api("POST", null, Object.assign({ action: "add" }, fd));
        msg.textContent = "✓ บันทึกแล้ว"; msg.className = "msg ok";
        resetPartial();
        load();
      } catch (e) {
        msg.textContent = "✗ " + e.message; msg.className = "msg err";
      } finally {
        $("#submitBtn").disabled = false;
      }
    };

    showAll.onchange = load;
    form.querySelector('[name=date]').value = todayISO();
    if (APPS_SCRIPT_URL.startsWith("PASTE_")) {
      listEl.innerHTML = '<p class="err">ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL ในไฟล์ index.html</p>';
    } else {
      load();
    }
  </script>
</body>
</html>
